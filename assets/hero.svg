<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Jing Cao - building systems that can prove themselves</title>
  <desc id="desc">A dark technical banner with the name Jing Cao, a systems-building statement, and a diagram for evidence, decisions, and replay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1211"/>
      <stop offset="0.55" stop-color="#101a18"/>
      <stop offset="1" stop-color="#08100f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b8f7ea" stroke-opacity=".045"/>
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect x="44" y="40" width="5" height="280" rx="2.5" fill="url(#accent)"/>

  <g class="mono" fill="#8ba8a2" font-size="13" letter-spacing="2.6">
    <text x="78" y="66">JING CAO</text>
    <text x="78" y="88" fill="#5f7772" font-size="11">HIT CS / HARBIN</text>
  </g>

  <g class="sans" fill="#f3fbf8">
    <text x="78" y="171" font-size="54" font-weight="750" letter-spacing="-1">BUILDING SYSTEMS</text>
    <text x="78" y="228" font-size="52" font-weight="750" letter-spacing="-1">THAT CAN PROVE THEMSELVES.</text>
  </g>

  <g class="mono" fill="#8ba8a2" font-size="13">
    <text x="80" y="276">EVIDENCE-FIRST AI</text>
    <text x="267" y="276" fill="#5f7772">/</text>
    <text x="287" y="276">AGENT INFRASTRUCTURE</text>
    <text x="520" y="276" fill="#5f7772">/</text>
    <text x="540" y="276">REPLAYABLE DECISIONS</text>
  </g>

  <g transform="translate(866 48)">
    <rect width="350" height="264" rx="12" fill="#0b1513" stroke="#27413b"/>
    <g class="mono" fill="#6f8f88" font-size="11" letter-spacing="1.4">
      <text x="22" y="27">SYSTEM LOOP</text>
      <text x="302" y="27" text-anchor="end" fill="#5eead4">01 / 04</text>
    </g>

    <g class="mono" font-size="12">
      <rect x="22" y="49" width="306" height="36" rx="6" fill="#10221e" stroke="#2b574d"/>
      <text x="38" y="72" fill="#d7fff7">01  RULES NOMINATE</text>
      <path d="M175 85V101" stroke="#2b574d"/>
      <path d="m170 96 5 5 5-5" fill="none" stroke="#2b574d"/>

      <rect x="22" y="101" width="306" height="36" rx="6" fill="#10221e" stroke="#2b574d"/>
      <text x="38" y="124" fill="#d7fff7">02  EVIDENCE VERIFIES</text>
      <path d="M175 137V153" stroke="#2b574d"/>
      <path d="m170 148 5 5 5-5" fill="none" stroke="#2b574d"/>

      <rect x="22" y="153" width="306" height="36" rx="6" fill="#10221e" stroke="#2b574d"/>
      <text x="38" y="176" fill="#d7fff7">03  MODEL REVIEWS</text>
      <path d="M175 189V205" stroke="#2b574d"/>
      <path d="m170 200 5 5 5-5" fill="none" stroke="#2b574d"/>

      <rect x="22" y="205" width="306" height="36" rx="6" fill="#14352f" stroke="#5eead4"/>
      <text x="38" y="228" fill="#eafffb">04  REPLAY PROVES</text>
    </g>
  </g>

  <g class="mono" fill="#5f7772" font-size="11">
    <text x="80" y="321">$ evidence -&gt; decision -&gt; replay</text>
    <text x="1200" y="321" text-anchor="end">github.com/TbK0ng</text>
  </g>
</svg>
