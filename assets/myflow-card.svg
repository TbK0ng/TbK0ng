<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">myflow project card</title>
  <desc id="desc">myflow is a context state machine harness for coding agents with plan approval, bounded context, write scopes, and verify gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111412"/>
      <stop offset="1" stop-color="#1b1711"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffe3b0" stroke-opacity=".04"/>
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", "Noto Sans", sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="260" fill="#f0b36a"/>

  <g class="mono" fill="#f0b36a" font-size="12" letter-spacing="1.8">
    <text x="38" y="39">02 / CONTEXT STATE MACHINES</text>
    <text x="1162" y="39" text-anchor="end" fill="#9b8b73">TYPESCRIPT / NODE / PYTHON</text>
  </g>

  <g class="sans" fill="#fff9ef">
    <text x="38" y="104" font-size="46" font-weight="750" letter-spacing="1">MYFLOW</text>
    <text x="38" y="139" font-size="18" fill="#d3c4ad">A context state machine for long-running coding agents.</text>
  </g>

  <g class="mono" fill="#d3c4ad" font-size="12">
    <text x="38" y="184">PLAN</text>
    <path d="M100 180h35" stroke="#7d6748"/>
    <text x="151" y="184">APPROVE</text>
    <path d="M254 180h35" stroke="#7d6748"/>
    <text x="305" y="184">IMPLEMENT</text>
    <path d="M425 180h35" stroke="#7d6748"/>
    <text x="476" y="184">VERIFY</text>
    <path d="M560 180h35" stroke="#7d6748"/>
    <text x="611" y="184">ARCHIVE</text>
  </g>

  <g class="mono" fill="#9b8b73" font-size="11">
    <text x="38" y="224">38 test files / 470 cases / 0 runtime dependencies</text>
    <text x="1162" y="224" text-anchor="end">github.com/TbK0ng/myflow</text>
  </g>
</svg>
